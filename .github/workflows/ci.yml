# CI – rules H-8 to H-10
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fresh, throwaway database for the integration tests (Q-4). root without a
    # password, so no password is in the repo (S-44); the container lives only
    # for this run.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: tater_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql, zlib
          coverage: none

      - name: Check syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Validate and install Composer packages
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress

      - name: Known vulnerabilities
        run: composer audit

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests
        env:
          TATER_TEST_DB_HOST: 127.0.0.1
          TATER_TEST_DB_PORT: '3306'
          TATER_TEST_DB_NAME: tater_test
          TATER_TEST_DB_USER: root
          TATER_TEST_DB_PASSWORD: ''
        # --fail-on-skipped: in the CI every database test has to run.
        run: vendor/bin/phpunit --fail-on-skipped

      # Q-3: browser tests for the search JavaScript. They run against the
      # built-in PHP server with the sample vehicles in a separate database and
      # drive the runner's Chrome via the DevTools protocol (tests/Browser/).
      - name: Prepare app for browser tests
        run: |
          mysql --host=127.0.0.1 --user=root -e 'CREATE DATABASE tater_browser CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mkdir -p data
          php -r 'require "vendor/autoload.php"; file_put_contents("data/config.php", Lab09\Disclaimer\Config::export(["db" => ["host" => "127.0.0.1", "port" => 3306, "name" => "tater_browser", "user" => "root", "password" => ""]]));'
          php bin/console migrate
          php bin/console sample-data:load
          php -S 127.0.0.1:8080 -t public > "$RUNNER_TEMP/php-server.log" 2>&1 &
          google-chrome --headless=new --disable-gpu --no-first-run --remote-debugging-port=9222 \
            --user-data-dir="$RUNNER_TEMP/chrome" about:blank > "$RUNNER_TEMP/chrome.log" 2>&1 &
          for i in $(seq 1 50); do
            curl --silent --fail http://127.0.0.1:9222/json/version > /dev/null \
              && curl --silent --fail http://127.0.0.1:8080/health > /dev/null && exit 0
            sleep 0.2
          done
          echo "Server or Chrome did not start"; cat "$RUNNER_TEMP/php-server.log" "$RUNNER_TEMP/chrome.log"; exit 1

      - name: Browser tests
        env:
          BASE_URL: http://127.0.0.1:8080
          DEBUG_PORT: '9222'
        run: python3 -I tests/Browser/test_search.py

      - name: Server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/php-server.log" data/logs/error.log 2>/dev/null || true
